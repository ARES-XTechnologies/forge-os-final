# Builds the FORGE OS installer ISO on GitHub's servers (free).
# Run it from the Actions tab ("Build FORGE OS ISO" > "Run workflow"),
# or push a tag like v1.0.0 to also publish it as a Release download.
#
# Safety:
#  - Third-party actions are pinned to exact commit hashes (the version is noted beside each),
#    so a changed or hijacked tag can't change what runs here.
#  - The build job can only read the repository. Only the separate release job, which runs
#    for tags only, may write (to publish the ISO).
#  - The ISO is built from the tested package snapshot in system/os-snapshot (see
#    iso/build-iso.sh), so the container's starting image doesn't change the result.
name: Build FORGE OS ISO

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: archlinux:base
      options: --privileged
    steps:
      - name: Get the code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build the ISO
        run: bash iso/build-iso.sh

      - name: Upload the ISO
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: forge-os-iso
          path: out/*.iso
          compression-level: 0
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Get the ISO from the build job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: forge-os-iso
          path: out

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: out/*.iso
